# Configuration Nginx alternative si vous avez déjà Nginx + Certbot sur votre serveur Debian
# À placer dans /etc/nginx/sites-available/mathieuegardtest.fr puis :
#   sudo ln -s /etc/nginx/sites-available/mathieuegardtest.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mathieuegardtest.fr

server {
    listen 80;
    listen [::]:80;
    server_name mathieuegardtest.fr;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
